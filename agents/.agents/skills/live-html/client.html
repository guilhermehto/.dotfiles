<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>live-html</title>
<style>
  :root {
    --bg:#fff; --fg:#1a1a1a; --muted:#5a5a5a; --accent:#0b66e4; --border:#e1e1e6;
    --surface:#f5f5f7; --code:#f0f0f3; --mark:#fff3b0; --mark-active:#ffd84d;
    --ok:#2f8a3c; --warn:#b06d00; --error:#c62828;
    --changed:#3fa34d; --changed-bg:rgba(63,163,77,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1115; --fg:#e8e8ec; --muted:#9aa0aa; --accent:#6aa8ff; --border:#2a2e38;
      --surface:#1a1d24; --code:#161922; --mark:#5a4d12; --mark-active:#8a7415;
      --ok:#5dbb6a; --warn:#d9a441; --error:#ef6b6b;
      --changed:#5dbb6a; --changed-bg:rgba(93,187,106,.1);
    }
  }
  [hidden] { display:none !important; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    line-height:1.55; display:grid; grid-template-columns:minmax(0,1fr) 360px; min-height:100vh;
  }

  .lh-doc { padding:2.5rem 2.5rem 6rem; max-width:880px; min-width:0; }
  .lh-doc h1 { font-size:1.9rem; margin:0 0 .6rem; }
  .lh-doc h2 { font-size:1.4rem; margin:2rem 0 .5rem; border-bottom:1px solid var(--border); padding-bottom:.3rem; }
  .lh-doc h3 { font-size:1.15rem; margin:1.4rem 0 .4rem; }
  .lh-doc h4, .lh-doc h5, .lh-doc h6 { margin:1.2rem 0 .3rem; }
  .lh-doc code { background:var(--code); padding:.1em .35em; border-radius:4px; font-family:ui-monospace,Menlo,monospace; font-size:.9em; }
  .lh-doc pre { background:var(--code); padding:1rem; border-radius:8px; overflow-x:auto; }
  .lh-doc pre code { background:none; padding:0; }
  .lh-doc pre.frontmatter { color:var(--muted); font-size:.85em; }
  .lh-doc blockquote { margin:1rem 0; padding:.2rem 1rem; border-left:3px solid var(--border); color:var(--muted); }
  .lh-doc blockquote.alert { color:var(--fg); }
  .lh-doc .alert-title { font-weight:600; margin:.4rem 0 .2rem; }
  .lh-doc .alert-note, .lh-doc .alert-tip { border-left-color:var(--accent); }
  .lh-doc .alert-important { border-left-color:#8250df; }
  .lh-doc .alert-warning { border-left-color:var(--warn); }
  .lh-doc .alert-caution { border-left-color:var(--error); }
  .lh-doc a { color:var(--accent); }
  .lh-doc hr { border:none; border-top:1px solid var(--border); margin:1.5rem 0; }
  .lh-doc img { max-width:100%; }
  .lh-doc ul, .lh-doc ol { padding-left:1.6rem; }
  .lh-doc li.task { list-style:none; margin-left:-1.3rem; }
  .lh-doc li.task > p:first-of-type { display:inline; }
  .lh-doc .table { overflow-x:auto; margin:1rem 0; }
  .lh-doc table { border-collapse:collapse; }
  .lh-doc th, .lh-doc td { border:1px solid var(--border); padding:.35rem .7rem; vertical-align:top; }
  .lh-doc th { background:var(--surface); }
  .lh-doc .align-left { text-align:left; }
  .lh-doc .align-center { text-align:center; }
  .lh-doc .align-right { text-align:right; }
  .lh-doc .lh-diagram { margin:1rem 0; overflow-x:auto; }
  .lh-doc .lh-diagram svg { max-width:100%; height:auto; }
  .lh-doc .lh-changed { background:var(--changed-bg); box-shadow:-6px 0 0 0 var(--changed); border-radius:2px; }

  mark.lh-mark { background:var(--mark); color:inherit; border-radius:2px; cursor:pointer; }
  mark.lh-mark.active { background:var(--mark-active); }

  .lh-side {
    border-left:1px solid var(--border); background:var(--surface); padding:1rem;
    position:sticky; top:0; height:100vh; overflow-y:auto; display:flex; flex-direction:column; gap:.6rem;
  }
  .lh-file { font-weight:600; font-size:.9rem; word-break:break-all; }
  .lh-connection { font-size:.78rem; color:var(--error); }
  .lh-side h2 { font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:.4rem 0 .2rem; }
  .lh-section-head { display:flex; align-items:center; justify-content:space-between; }
  .lh-link { background:none; border:none; padding:0; color:var(--accent); font:inherit; font-size:.8rem; cursor:pointer; }
  .lh-empty { color:var(--muted); font-size:.85rem; margin:.2rem 0; }
  .lh-cards { display:flex; flex-direction:column; gap:.6rem; }

  .lh-card { border:1px solid var(--border); border-radius:8px; padding:.5rem .6rem; background:var(--bg); }
  .lh-card.active { border-color:var(--accent); }
  .lh-card.approved { border-color:var(--ok); }
  .lh-card.lost { border-color:var(--warn); }
  .lh-card.lh-pending { opacity:.85; }
  .lh-quote {
    font-size:.75rem; color:var(--muted); border-left:2px solid var(--mark-active); padding-left:.5rem;
    margin-bottom:.4rem; max-height:3.2em; overflow:hidden; white-space:pre-wrap;
  }
  .lh-quote.general { border-left-color:var(--accent); font-style:italic; }
  .lh-comment { font-size:.85rem; white-space:pre-wrap; }
  .lh-card textarea {
    width:100%; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--fg);
    padding:.4rem; font:inherit; font-size:.85rem; resize:vertical; min-height:2.6em;
  }
  .lh-row { display:flex; align-items:center; gap:.5rem; margin-top:.35rem; font-size:.78rem; color:var(--muted); }
  .lh-row label { display:flex; align-items:center; gap:.3rem; cursor:pointer; }
  .lh-hint { flex:1; }
  .approved .lh-hint { color:var(--ok); }
  .lost .lh-hint { color:var(--warn); }
  .lh-delete { background:none; border:none; color:var(--muted); cursor:pointer; font-size:1.05rem; line-height:1; }

  .lh-footer { margin-top:auto; position:sticky; bottom:-1rem; background:var(--surface); padding:.6rem 0 1rem; }
  #lh-send { width:100%; padding:.6rem; border:none; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  #lh-send:disabled { opacity:.4; cursor:default; }
  .lh-status { font-size:.8rem; color:var(--muted); margin-top:.4rem; min-height:1.2em; }
  .lh-status[data-tone="ok"] { color:var(--ok); }
  .lh-status[data-tone="error"] { color:var(--error); }
  .lh-changes { font-size:.8rem; color:var(--muted); display:flex; gap:.5rem; align-items:baseline; }

  .lh-add {
    position:absolute; z-index:10; padding:.3rem .6rem; border:none; border-radius:6px; background:var(--accent);
    color:#fff; font:inherit; font-size:.8rem; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.25);
  }

  @media (max-width: 900px) {
    body { grid-template-columns:1fr; }
    .lh-side { position:static; height:auto; border-left:none; border-top:1px solid var(--border); }
  }
</style>
</head>
<body>
  <main id="lh-doc" class="lh-doc"></main>
  <aside class="lh-side">
    <div>
      <div id="lh-file" class="lh-file"></div>
      <div id="lh-connection" class="lh-connection" hidden>Disconnected from the server — retrying…</div>
    </div>

    <div class="lh-section-head">
      <h2>Drafts</h2>
      <button id="lh-general" class="lh-link" type="button">＋ General comment</button>
    </div>
    <p id="lh-drafts-empty" class="lh-empty">Select text in the doc to comment on it.</p>
    <div id="lh-drafts" class="lh-cards"></div>

    <div id="lh-pending" class="lh-cards"></div>

    <div class="lh-footer">
      <button id="lh-send" type="button" disabled>Send ►</button>
      <div id="lh-status" class="lh-status"></div>
      <div id="lh-changes" class="lh-changes" hidden>
        <span id="lh-changes-text"></span>
        <button id="lh-jump" class="lh-link" type="button">Jump ↓</button>
      </div>
    </div>
  </aside>
  <button id="lh-add" class="lh-add" type="button" hidden>＋ Comment</button>

  <script src="/markdown.js"></script>
  <script src="/client.js"></script>
</body>
</html>
