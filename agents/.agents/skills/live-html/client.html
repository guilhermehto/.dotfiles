<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>live-html</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='4' width='26' height='19' rx='5' fill='%230969da'/%3E%3Cpath d='M9 23v6l7-6z' fill='%230969da'/%3E%3Cpath d='M9 11h14M9 16h9' stroke='%23fff' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme:light dark;
    --bg:#fff; --fg:#1f2328; --muted:#656d76; --accent:#0969da; --accent-fg:#fff;
    --border:#d0d7de; --border-soft:#e6e9ed; --surface:#f6f8fa; --surface-2:#eef1f4; --code:rgba(175,184,193,.2);
    --ok:#1a7f37; --ok-bg:rgba(31,136,61,.1); --warn:#9a6700; --warn-bg:rgba(212,167,44,.14);
    --error:#cf222e; --error-bg:rgba(207,34,46,.08); --purple:#8250df;
    --changed:#2da44e; --changed-bg:rgba(45,164,78,.16);
    --mark:rgba(255,212,59,.38); --mark-line:#d4a72c; --mark-active:rgba(255,200,40,.7);
    --shadow:0 1px 2px rgba(31,35,40,.06), 0 3px 10px rgba(31,35,40,.08);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0d1117; --fg:#e6edf3; --muted:#8d96a0; --accent:#4493f8; --accent-fg:#fff;
      --border:#30363d; --border-soft:#21262d; --surface:#151b23; --surface-2:#1c232c; --code:rgba(110,118,129,.25);
      --ok:#3fb950; --ok-bg:rgba(46,160,67,.15); --warn:#d29922; --warn-bg:rgba(187,128,9,.18);
      --error:#f85149; --error-bg:rgba(248,81,73,.12); --purple:#ab7df8;
      --changed:#3fb950; --changed-bg:rgba(46,160,67,.2);
      --mark:rgba(210,153,34,.3); --mark-line:#d29922; --mark-active:rgba(210,153,34,.6);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);
    }
  }
  [hidden] { display:none !important; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); }
  body {
    font-family:var(--sans); line-height:1.5; -webkit-font-smoothing:antialiased;
    display:grid; grid-template-columns:minmax(0,1fr) 380px; min-height:100vh;
  }
  button { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  kbd {
    font-family:var(--sans); font-size:.72em; padding:.05em .4em; border:1px solid var(--border);
    border-bottom-width:2px; border-radius:4px; background:var(--bg); color:var(--muted); white-space:nowrap;
  }

  /* ---- document ---- */
  .lh-main { min-width:0; }
  .lh-doc { max-width:48rem; margin:0 auto; padding:3rem 2.5rem 8rem; font-size:1rem; line-height:1.65; overflow-wrap:break-word; }
  .lh-doc ::selection { background:rgba(9,105,218,.25); }
  .lh-doc > :first-child { margin-top:0; }
  .lh-doc h1, .lh-doc h2, .lh-doc h3, .lh-doc h4, .lh-doc h5, .lh-doc h6 {
    line-height:1.25; font-weight:650; letter-spacing:-.01em; margin:1.8em 0 .6em; scroll-margin-top:1.5rem;
  }
  .lh-doc h1 { font-size:2rem; margin-top:0; padding-bottom:.3em; border-bottom:1px solid var(--border-soft); }
  .lh-doc h2 { font-size:1.45rem; padding-bottom:.3em; border-bottom:1px solid var(--border-soft); }
  .lh-doc h3 { font-size:1.2rem; }
  .lh-doc h4 { font-size:1rem; }
  .lh-doc h5, .lh-doc h6 { font-size:.9rem; color:var(--muted); }
  .lh-doc p, .lh-doc ul, .lh-doc ol, .lh-doc blockquote, .lh-doc pre, .lh-doc .table { margin:0 0 1rem; }
  .lh-doc a { color:var(--accent); text-decoration-thickness:1px; text-underline-offset:2px; }
  .lh-doc strong { font-weight:650; }
  .lh-doc code { background:var(--code); padding:.15em .38em; border-radius:6px; font-family:var(--mono); font-size:.85em; }
  .lh-doc pre {
    background:var(--surface); border:1px solid var(--border-soft); padding:.9rem 1rem; border-radius:8px;
    overflow-x:auto; line-height:1.5; font-size:.88rem;
  }
  .lh-doc pre code { background:none; padding:0; border-radius:0; font-size:inherit; }
  .lh-doc pre.frontmatter { color:var(--muted); font-size:.8rem; }
  .lh-doc pre.frontmatter::before {
    content:"Front matter"; display:block; margin-bottom:.35rem; font:600 .68rem/1.4 var(--sans);
    letter-spacing:.06em; text-transform:uppercase;
  }
  .lh-doc blockquote { padding:.1rem 1rem; border-left:3px solid var(--border); color:var(--muted); }
  .lh-doc blockquote > :last-child { margin-bottom:.4rem; }
  .lh-doc blockquote > :first-child { margin-top:.4rem; }
  .lh-doc blockquote.alert { color:var(--fg); border-radius:0 6px 6px 0; padding:.5rem 1rem; }
  .lh-doc .alert-title { font-weight:600; font-size:.9rem; margin-bottom:.25rem; }
  .lh-doc .alert-note, .lh-doc .alert-tip { border-left-color:var(--accent); background:rgba(9,105,218,.06); }
  .lh-doc .alert-note .alert-title { color:var(--accent); }
  .lh-doc .alert-tip { border-left-color:var(--ok); background:var(--ok-bg); }
  .lh-doc .alert-tip .alert-title { color:var(--ok); }
  .lh-doc .alert-important { border-left-color:var(--purple); background:rgba(130,80,223,.08); }
  .lh-doc .alert-important .alert-title { color:var(--purple); }
  .lh-doc .alert-warning { border-left-color:var(--warn); background:var(--warn-bg); }
  .lh-doc .alert-warning .alert-title { color:var(--warn); }
  .lh-doc .alert-caution { border-left-color:var(--error); background:var(--error-bg); }
  .lh-doc .alert-caution .alert-title { color:var(--error); }
  .lh-doc hr { border:none; height:1px; background:var(--border); margin:2rem 0; }
  .lh-doc img { max-width:100%; border-radius:6px; }
  .lh-doc ul, .lh-doc ol { padding-left:1.7rem; }
  .lh-doc li + li, .lh-doc li > ul, .lh-doc li > ol { margin-top:.25rem; }
  .lh-doc li > ul, .lh-doc li > ol { margin-bottom:0; }
  .lh-doc li.task { list-style:none; margin-left:-1.4rem; }
  .lh-doc li.task > input { margin:0 .45rem 0 0; vertical-align:-.1em; accent-color:var(--ok); }
  .lh-doc li.task > p:first-of-type { display:inline; }
  .lh-doc .table { overflow-x:auto; }
  .lh-doc table { border-collapse:collapse; font-size:.92rem; }
  .lh-doc th, .lh-doc td { border:1px solid var(--border); padding:.4rem .75rem; vertical-align:top; }
  .lh-doc th { background:var(--surface); font-weight:600; text-align:left; }
  .lh-doc tbody tr:nth-child(even) td { background:var(--surface); }
  .lh-doc .align-left { text-align:left; }
  .lh-doc .align-center { text-align:center; }
  .lh-doc .align-right { text-align:right; }
  .lh-doc .lh-diagram { margin:0 0 1rem; overflow-x:auto; }
  .lh-doc .lh-diagram svg { max-width:100%; height:auto; }

  /* Box shadows rather than a pseudo-element: pre, tables and diagrams scroll,
     and their overflow would clip anything drawn outside the box. */
  .lh-doc .lh-changed { --gutter:-12px 0 0 0 var(--bg), -15px 0 0 0 var(--changed); box-shadow:var(--gutter); scroll-margin:30vh 0; }
  .lh-doc .lh-changed.lh-flash { animation:lh-flash 2.4s ease-out; }
  @keyframes lh-flash {
    from { box-shadow:var(--gutter), inset 0 0 0 100vmax var(--changed-bg); }
    to { box-shadow:var(--gutter), inset 0 0 0 100vmax transparent; }
  }

  mark.lh-mark {
    background:var(--mark); color:inherit; border-radius:2px; cursor:pointer;
    box-shadow:inset 0 -2px 0 var(--mark-line); transition:background .12s;
  }
  mark.lh-mark.approved { box-shadow:inset 0 -2px 0 var(--ok); }
  mark.lh-mark.hover, mark.lh-mark.active { background:var(--mark-active); }

  /* ---- sidebar ---- */
  .lh-side {
    border-left:1px solid var(--border); background:var(--surface);
    position:sticky; top:0; height:100vh; display:flex; flex-direction:column; min-width:0;
  }
  .lh-head { padding:.9rem 1rem .75rem; border-bottom:1px solid var(--border-soft); }
  .lh-file-row { display:flex; align-items:center; gap:.6rem; }
  .lh-file { flex:1; min-width:0; font-weight:600; font-size:.95rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* rtl puts the ellipsis on the left so the end of a long path stays visible. */
  .lh-dir { font-size:.74rem; color:var(--muted); direction:rtl; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:.1rem; }
  .lh-connection { display:inline-flex; align-items:center; gap:.35rem; font-size:.72rem; color:var(--muted); white-space:nowrap; }
  .lh-connection::before { content:""; width:.5rem; height:.5rem; border-radius:50%; background:var(--muted); }
  .lh-connection[data-state="live"]::before { background:var(--ok); box-shadow:0 0 0 3px var(--ok-bg); }
  .lh-connection[data-state="reconnecting"] { color:var(--warn); }
  .lh-connection[data-state="reconnecting"]::before { background:var(--warn); animation:lh-pulse 1.2s ease-in-out infinite; }

  .lh-scroll { flex:1; overflow-y:auto; padding:.75rem 1rem 1rem; display:flex; flex-direction:column; gap:.6rem; }
  .lh-side h2 {
    display:flex; align-items:center; gap:.4rem; font-size:.72rem; font-weight:600; text-transform:uppercase;
    letter-spacing:.06em; color:var(--muted); margin:.5rem 0 0;
  }
  .lh-count {
    font-size:.7rem; letter-spacing:0; min-width:1.3rem; padding:0 .35rem; border-radius:999px;
    background:var(--surface-2); color:var(--muted); text-align:center; line-height:1.3rem;
  }
  .lh-section-head { display:flex; align-items:center; justify-content:space-between; }
  .lh-section-head h2 { margin:0; }
  .lh-link {
    background:none; border:none; padding:.15rem .3rem; margin:-.15rem -.3rem; border-radius:4px;
    color:var(--accent); font-size:.8rem; font-weight:500; cursor:pointer;
  }
  .lh-link:hover { background:var(--surface-2); }
  .lh-icon {
    flex:none; display:inline-grid; place-items:center; width:1.6rem; height:1.6rem; padding:0;
    border:none; border-radius:6px; background:none; color:var(--muted); cursor:pointer; font-size:1.05rem; line-height:1;
  }
  .lh-icon:hover { background:var(--surface-2); color:var(--fg); }

  .lh-empty { color:var(--muted); font-size:.82rem; border:1px dashed var(--border); border-radius:8px; padding:.7rem .9rem; }
  .lh-empty ol { margin:0; padding-left:1.1rem; display:grid; gap:.35rem; }
  .lh-empty b { color:var(--fg); font-weight:600; }

  .lh-activity {
    display:flex; align-items:flex-start; gap:.4rem; padding:.55rem .5rem .55rem .75rem; border-radius:8px;
    background:var(--ok-bg); border:1px solid color-mix(in srgb, var(--ok) 35%, transparent); font-size:.82rem;
  }
  .lh-activity-body { flex:1; display:grid; gap:.15rem; padding-top:.1rem; }
  .lh-applied { color:var(--ok); font-weight:600; }
  .lh-changes { display:flex; flex-wrap:wrap; gap:.15rem .6rem; align-items:baseline; }
  .lh-activity .lh-icon { margin:-.15rem 0; }

  .lh-cards { display:flex; flex-direction:column; gap:.55rem; }
  .lh-card {
    position:relative; border:1px solid var(--border); border-radius:8px; padding:.6rem .65rem .5rem;
    background:var(--bg); box-shadow:var(--shadow); transition:border-color .12s, box-shadow .12s;
  }
  .lh-card::before {
    content:""; position:absolute; left:-1px; top:-1px; bottom:-1px; width:3px; border-radius:8px 0 0 8px;
    background:transparent;
  }
  .lh-card.hover, .lh-card.active { border-color:var(--mark-line); }
  .lh-card.active { box-shadow:0 0 0 3px var(--mark), var(--shadow); }
  .lh-card.approved::before { background:var(--ok); }
  .lh-card.lost::before { background:var(--warn); }
  .lh-quote {
    font-size:.78rem; color:var(--muted); border-left:2px solid var(--mark-line); padding-left:.5rem; margin-bottom:.45rem;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden; cursor:pointer;
  }
  .lh-quote.general { border-left-color:var(--accent); font-style:italic; cursor:default; }
  .lh-lost {
    font-size:.74rem; color:var(--warn); background:var(--warn-bg); border-radius:5px; padding:.25rem .45rem; margin-bottom:.45rem;
  }
  .lh-card textarea {
    display:block; width:100%; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--fg);
    padding:.45rem .55rem; font:inherit; font-size:.86rem; line-height:1.45; resize:none; min-height:2.4rem; max-height:40vh;
  }
  .lh-card textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(9,105,218,.18); }
  .lh-row { display:flex; align-items:center; gap:.5rem; margin-top:.45rem; font-size:.76rem; color:var(--muted); }
  .lh-approve {
    display:inline-flex; align-items:center; gap:.35rem; padding:.15rem .55rem .15rem .4rem; border:1px solid var(--border);
    border-radius:999px; cursor:pointer; user-select:none; color:var(--fg); background:var(--bg);
  }
  .lh-approve input { margin:0; accent-color:var(--ok); cursor:inherit; }
  .lh-approve:has(input:disabled) { opacity:.5; cursor:default; }
  .approved .lh-approve { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); font-weight:600; }
  .lh-hint { flex:1; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lh-delete:hover { color:var(--error); background:var(--error-bg); }

  .lh-pending .lh-card { box-shadow:none; background:transparent; border-style:dashed; padding-bottom:.6rem; }
  .lh-comment { font-size:.85rem; white-space:pre-wrap; }
  .lh-busy::before {
    content:""; width:.45rem; height:.45rem; border-radius:50%; background:var(--accent); animation:lh-pulse 1.2s ease-in-out infinite;
  }
  @keyframes lh-pulse { 50% { opacity:.25; } }

  .lh-footer { padding:.75rem 1rem 1rem; border-top:1px solid var(--border-soft); background:var(--surface); }
  .lh-status { font-size:.8rem; margin-bottom:.6rem; padding:.4rem .6rem; border-radius:6px; }
  .lh-status:empty { display:none; }
  .lh-status[data-tone="error"] { color:var(--error); background:var(--error-bg); }
  .lh-status[data-tone="warn"] { color:var(--warn); background:var(--warn-bg); }
  .lh-send {
    width:100%; display:flex; align-items:center; justify-content:center; gap:.6rem; padding:.6rem .8rem; border:none;
    border-radius:8px; background:var(--accent); color:var(--accent-fg); font-weight:600; cursor:pointer; transition:filter .12s;
  }
  .lh-send:hover:not(:disabled) { filter:brightness(1.08); }
  .lh-send kbd { background:rgba(255,255,255,.18); border-color:rgba(255,255,255,.35); color:inherit; }
  .lh-send:disabled { background:var(--surface-2); color:var(--muted); cursor:default; }
  .lh-send:disabled kbd { display:none; }

  .lh-add {
    position:absolute; z-index:10; display:inline-flex; align-items:center; gap:.45rem; padding:.35rem .55rem .35rem .7rem;
    border:none; border-radius:8px; background:var(--fg); color:var(--bg); font-size:.8rem; font-weight:600; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.25); animation:lh-pop .12s ease-out;
  }
  .lh-add kbd { background:transparent; color:inherit; border-color:currentColor; opacity:.6; }
  @keyframes lh-pop { from { opacity:0; transform:translateY(-3px); } }

  @media (max-width: 900px) {
    body { grid-template-columns:1fr; }
    .lh-doc { padding:2rem 1.25rem 3rem; }
    .lh-side { position:static; height:auto; border-left:none; border-top:1px solid var(--border); }
    .lh-scroll { overflow:visible; }
    .lh-footer { position:sticky; bottom:0; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
  <main class="lh-main">
    <article id="lh-doc" class="lh-doc"></article>
  </main>

  <aside class="lh-side" aria-label="Comments">
    <header class="lh-head">
      <div class="lh-file-row">
        <span id="lh-file" class="lh-file"></span>
        <span id="lh-connection" class="lh-connection" data-state="connecting">Connecting…</span>
      </div>
      <div id="lh-dir" class="lh-dir"></div>
    </header>

    <div class="lh-scroll">
      <section id="lh-activity" class="lh-activity" role="status" hidden>
        <div class="lh-activity-body">
          <div id="lh-applied" class="lh-applied" hidden></div>
          <div id="lh-changes" class="lh-changes" hidden>
            <span id="lh-changes-text"></span>
            <button id="lh-jump" class="lh-link" type="button">Next change ↓</button>
          </div>
        </div>
        <button id="lh-dismiss" class="lh-icon" type="button" title="Dismiss and clear change markers" aria-label="Dismiss">×</button>
      </section>

      <div class="lh-section-head">
        <h2>Drafts <span id="lh-draft-count" class="lh-count" hidden></span></h2>
        <button id="lh-general" class="lh-link" type="button" title="Comment on the whole document">＋ General comment</button>
      </div>
      <div id="lh-drafts-empty" class="lh-empty">
        <ol>
          <li>Select text, then <b>Comment</b> <kbd>C</kbd></li>
          <li>Write what should change, <kbd>⏎</kbd> to approve</li>
          <li><kbd class="lh-mod">⌘⏎</kbd> sends approved drafts to the agent</li>
        </ol>
      </div>
      <div id="lh-drafts" class="lh-cards"></div>

      <div id="lh-pending" class="lh-cards lh-pending"></div>
    </div>

    <footer class="lh-footer">
      <div id="lh-status" class="lh-status" role="alert"></div>
      <button id="lh-send" class="lh-send" type="button" disabled>
        <span id="lh-send-label">Send</span><kbd class="lh-mod">⌘⏎</kbd>
      </button>
    </footer>
  </aside>

  <button id="lh-add" class="lh-add" type="button" hidden>Comment <kbd>C</kbd></button>

  <script src="/markdown.js"></script>
  <script src="/client.js"></script>
</body>
</html>
