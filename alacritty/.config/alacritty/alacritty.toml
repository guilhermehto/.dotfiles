# Colors (Tokyo Night Storm)
# Upstream: https://github.com/folke/tokyonight.nvim/raw/main/extras/alacritty/tokyonight_storm.toml

# Default colors
[colors.primary]
background = '#24283b'
foreground = '#c0caf5'

[colors.cursor]
text   = '#24283b'
cursor = '#c0caf5'

[colors.selection]
text       = '#c0caf5'
background = '#2e3c64'

# Normal colors
[colors.normal]
black   = '#1d202f'
red     = '#f7768e'
green   = '#9ece6a'
yellow  = '#e0af68'
blue    = '#7aa2f7'
magenta = '#bb9af7'
cyan    = '#7dcfff'
white   = '#a9b1d6'

# Bright colors
[colors.bright]
black   = '#414868'
red     = '#ff899d'
green   = '#9fe044'
yellow  = '#faba4a'
blue    = '#8db0ff'
magenta = '#c7a9ff'
cyan    = '#a4daff'
white   = '#c0caf5'

[[colors.indexed_colors]]
index = 16
color = '#ff9e64'

[[colors.indexed_colors]]
index = 17
color = '#db4b4b'

[env]
TERM = "xterm-256color"

[font]
size = 16.0

[font.bold]
family = "0xProto Nerd Font"
style = "Regular"

[font.normal]
family = "0xProto Nerd Font"
style = "Regular"

[window]
decorations = "Buttonless"

[window.padding]
x = 4
y = 4
