# ==== [GENERAL]
set -g default-terminal "tmux-256color"
# match on any outer TERM; the old xterm-256color override missed xterm-ghostty
set -as terminal-features ",*:RGB"
set -g mouse on
set -g mode-keys vi
set -g default-shell /bin/zsh
set -g detach-on-destroy off
set -g base-index 1
setw -g pane-base-index 1
set-option -g history-limit 50000

# Claude Code: passthrough lets desktop notifications and the progress bar
# reach the outer terminal; extended keys make Shift+Enter distinguishable
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features "xterm*:extkeys"

# ==== [REMAPS]

# prefix
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection -x

set-option -g status-position top

# splits
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# search
unbind [
bind / copy-mode

# pane resizing
bind H resize-pane -L 15
bind L resize-pane -R 15
bind K resize-pane -U 15
bind J resize-pane -D 15

# session management

bind-key "s" display-popup -E -w 40% "sesh connect \"$(sesh list -i | gum filter --no-strip-ansi --limit 1 --placeholder 'Pick a sesh' --prompt='󱐋 ')\""
bind-key "O" display-popup -E -w 50% "dir=\"$(sesh list -z | gum filter --limit 1 --placeholder 'Open IDE at' --prompt='󰀘 ')\"; [ -n \"\$dir\" ] && tmuxinator start ide root=\"\$dir\""
bind-key "k" display-popup -E -w 40% "session=\"$(sesh list -t | gum filter --limit 1 --placeholder 'Kill sesh' --prompt='󰆴 ')\"; [ -n \"\$session\" ] && tmux kill-session -t \"\$session\""
bind-key "P" display-popup -E -w 128 -h 16 "~/.config/sketchybar/plugins/prs.sh pick"
bind-key "F" display-popup -E -w 92 -h 18 "~/.config/sketchybar/plugins/flags.sh pick"
bind-key "T" display-popup -E -w 128 -h 18 "~/.config/sketchybar/plugins/jira.sh pick"

# tmux.nvim config
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|n?vim?x?)(-wrapped)?(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' { if -F '#{pane_at_left}' '' 'select-pane -L' }
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' { if -F '#{pane_at_top}' '' 'select-pane -U' }
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' { if -F '#{pane_at_right}' '' 'select-pane -R' }

bind-key -T copy-mode-vi 'C-h' if -F '#{pane_at_left}' '' 'select-pane -L'
bind-key -T copy-mode-vi 'C-j' if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key -T copy-mode-vi 'C-k' if -F '#{pane_at_top}' '' 'select-pane -U'
bind-key -T copy-mode-vi 'C-l' if -F '#{pane_at_right}' '' 'select-pane -R'

# reload
bind C-r source-file ~/.tmux.conf

# toggle last session
bind r switch-client -l

# kill current session
bind Q kill-session

# ressurect

set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

set -s escape-time 10

# ==== [PLUGINS]

set -g @plugin 'TechnicalDC/tmux-ayu-theme'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @resurrect-processes 'lazygit'

run '~/.tmux/plugins/tpm/tpm'

# tmux-ayu-theme uses pre-2.9 option names (status-bg, *-attr) that tmux 3.x
# silently ignores; set the modern *-style equivalents with the same palette
set -g status-style "bg=#101521,fg=#CBCCC6"
set -g message-style "bg=#101521,fg=#CBCCC6"
set -g message-command-style "bg=#101521,fg=#CBCCC6"
setw -g window-status-style "bg=#101521,fg=#CBCCC6"
setw -g window-status-activity-style "bg=#101521,fg=#E6B450"
set -g pane-border-style "bg=#101521,fg=#5C6773"
set -g pane-active-border-style "bg=#101521,fg=#BAE67E"
